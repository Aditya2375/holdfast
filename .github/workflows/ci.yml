name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Rootless actual-kernel tests
        run: |
          make test
          make ubsan
          cc -std=c11 -O0 -Wall -Wextra -Werror -fanalyzer -Isrc -c src/runtime.c -o build/analyze.o
      - name: Generated policy parity
        run: |
          python3 tools/export-policy.py
          git diff --exit-code -- docs/policy.js
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm test
          npm run test:browser
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: gitleaks full history, verified binary
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 2 --log-level warn --config .gitleaks.toml .
      - name: Browser DOM and no-network rules
        run: |
          pipx run --spec semgrep==1.183.0 semgrep --config .github/semgrep-rules.yml --error docs/ tests/ tools/
          pipx run --spec semgrep==1.183.0 semgrep --config .github/no-network.yml --error docs/
